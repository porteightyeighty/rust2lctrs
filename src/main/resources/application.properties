# The web demo (project.web.Demo). The CLI never reads this file.
# The deployment's environment variables are mapped explicitly, so they keep their old names.

server.port=${PORT:8080}
server.address=0.0.0.0
# Matches the previous fixed pool; Cora runs are bounded separately by cora.concurrency.
server.tomcat.threads.max=8
spring.main.banner-mode=off

demo.allowed-origin=${ALLOWED_ORIGIN:*}

cora.bin=${CORA_BIN:cora}
cora.timeout=${CORA_TIMEOUT_SECONDS:30}s
cora.concurrency=${CORA_CONCURRENCY:2}
cora.java-opts=${CORA_JAVA_OPTS:-Xmx384m}

# /actuator/health for liveness and /actuator/prometheus for scraping; nothing else is exposed.
management.endpoints.web.exposure.include=health,prometheus
